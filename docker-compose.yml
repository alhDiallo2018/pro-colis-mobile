services:
  sendprocolis-web:
    build:
      context: .
      args:
        API_BASE_URL: ${API_BASE_URL:-/api/v1}
        APP_BASE_URL: ${APP_BASE_URL:-}
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8081}:80"
    restart: unless-stopped
